name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Diagnostico sin red
        env:
          PROGRAMADOR_EMAIL: ci@example.com
          PROGRAMADOR_APP_PASSWORD: aaaa-bbbb-cccc-dddd
          PROGRAMADOR_CONFIG: config/entities.example.yaml
          PROGRAMADOR_DB: ${{ runner.temp }}/ci.db
        run: programador-doctor --sin-red
